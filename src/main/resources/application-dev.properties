# ==========================================
# PROFILE: DEV (Desenvolvimento/Demonstração)
# ==========================================
# Banco de dados H2 in-memory
# - Ideal para: apresentações, testes, desenvolvimento
# - Dados resetam a cada reinicialização
# - Não requer instalação de banco externo

# Datasource H2
spring.datasource.url=jdbc:h2:mem:disclosedcompanies
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 habilitado para visualização
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate - recria tabelas a cada inicialização
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Logging detalhado para desenvolvimento
logging.level.br.com.projeto.disclosedcompanies=DEBUG
logging.level.org.hibernate.SQL=DEBUG
