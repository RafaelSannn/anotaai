# ==========================================
# CONFIGURAÇÃO PRINCIPAL - Disclosed Companies
# ==========================================
# Use profiles para alternar entre ambientes:
# - dev: H2 in-memory (demonstrações/testes)
# - prod: MariaDB persistente (produção)

# Profile ativo (altere para 'prod' em produção)
spring.profiles.active=dev

# ==========================================
# CONFIGURAÇÕES GERAIS (TODOS OS PROFILES)
# ==========================================

# Aumentar limites para upload de imagens
server.tomcat.max-http-form-post-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging
logging.level.br.com.projeto.disclosedcompanies=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Porta do servidor
server.port=8080

# JPA Settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
